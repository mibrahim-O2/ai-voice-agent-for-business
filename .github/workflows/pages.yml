name: Deploy dashboard to GitHub Pages

# Publishes the static dashboard (dashboard/) with its recorded demo snapshot. GitHub Pages cannot
# run the Python backend, and the site never needs it: it only reads demo/snapshot.json.
on:
  push:
    branches: [main]
    paths: ["dashboard/**", "scripts/check_secrets.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assemble the static site
        run: |
          mkdir -p _site
          cp -r dashboard/. _site/
          touch _site/.nojekyll

      - name: Check the site is demo-only and carries no secrets
        run: |
          grep -q 'mode: "demo"' _site/config.js || { echo "config.js must select demo mode"; exit 1; }
          python3 -c "import json,sys; s=json.load(open('_site/demo/snapshot.json')); sys.exit(0 if s['meta']['demo'] is True else 'snapshot is not marked as demo data')"
          python3 scripts/check_secrets.py --path _site
          if grep -rIl "api.openai.com" _site; then echo "the dashboard must not call OpenAI"; exit 1; fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
