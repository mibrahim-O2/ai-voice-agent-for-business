name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secret scan diffs against the base branch

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Secret scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          python scripts/check_secrets.py
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python scripts/check_secrets.py --diff "origin/$BASE_REF"
          fi

      - name: Validate dummy data
        run: voice-agent validate-data

      - name: Tests (offline, no API key)
        env:
          OPENAI_API_KEY: ""
        run: pytest
